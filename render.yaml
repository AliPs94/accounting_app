services:
  # Django Backend API
  - type: web
    name: accounting-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn accounting_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: postgresql://accounting_db_zqws_user:oPPcoZUJFd1qZI3xrq3WryNHglRS1afi@dpg-d3gegt15pdvs73eeef40-a/accounting_db_zqws
    
  # Vue.js Frontend (Static Site)
  - type: web
    name: accounting-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        sync: false

