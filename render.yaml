services:
  # Django Backend API
  - type: web
    name: accounting-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py compilemessages
    startCommand: gunicorn accounting_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-db
          property: connectionString
    
  # PostgreSQL Database
  - type: pgsql
    name: accounting-db
    region: oregon
    plan: free
    databaseName: accounting_db
    user: accounting_user
    
  # Vue.js Frontend (Static Site)
  - type: web
    name: accounting-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0

