services:
  # Django Backend
  - type: web
    name: accounting-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn accounting_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-db
          property: connectionString
    
  # PostgreSQL Database
  - type: pgsql
    name: accounting-db
    plan: starter
    databaseName: accounting_db
    user: accounting_user

