[tool:pytest]
DJANGO_SETTINGS_MODULE = accounting_project.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers --disable-warnings --cov=accounting --cov-report=html --cov-report=term-missing --reuse-db
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow tests
testpaths = accounting
